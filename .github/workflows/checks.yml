name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:template
      - run: npm run build
      - run: npm run test:preview
      - run: npm run test:gpu
      - run: node desktop/service/test/theme-ui.mjs
      - run: node desktop/service/test/links-ui.mjs
      - run: node desktop/service/test/voice-ui.mjs
      - run: node desktop/service/test/clipboard-ui.mjs
      - run: node desktop/service/test/desktop-dictation-ui.mjs
      - run: powershell -NoProfile -File scripts/test-update-helpers.ps1
      - run: node desktop/service/test/groups-ui.mjs
      - run: node desktop/service/test/conversation-ui.mjs
      - run: node desktop/service/test/mobile-ui.mjs
      - run: node desktop/service/test/workspace-edit-ui.mjs
      - run: node desktop/service/test/cards-ui.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .agents/skills/fal-ai-generation/scripts -p test_fal_job.py -v
      - run: python -m unittest forge.tests.test_optional_vision_tooling -v
        working-directory: .agents/skills/img2threejs
      - run: python scripts/test-local-voice-setup.py
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential file libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev libwayland-dev patchelf
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:template
      - run: npm run build
      - run: npm run desktop:build:appimage
      - run: cargo test --manifest-path src-tauri/Cargo.toml login_path::tests
      - run: python3 scripts/test-local-voice-setup.py
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mr-mak-workspace-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:template
      - run: npm run build
      # Package and upload the app before the browser UI suites, so a UI timing
      # failure still fails the job but cannot hide whether the app builds.
      - run: npm run desktop:build -- --bundles app
      - name: Verify the app's code signature
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/release/bundle/macos/Mr. Mak Workspace.app"
      - run: cargo test --manifest-path src-tauri/Cargo.toml login_path::tests
      - run: python3 scripts/test-local-voice-setup.py
      - name: Verify packaged Node and native terminals
        run: '"src-tauri/target/release/bundle/macos/Mr. Mak Workspace.app/Contents/Resources/runtime/node" scripts/check-bundled-runtime.mjs'
      - name: Archive macOS app with executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Mr. Mak Workspace.app" mr-mak-workspace-macos.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mr-mak-workspace-macos-app
          path: mr-mak-workspace-macos.zip
          if-no-files-found: error
          retention-days: 14
      # The macOS app renders with WKWebView, so its UI checks run in WebKit.
      - run: npx playwright install webkit
      - run: npm run test:preview
      - run: node desktop/service/test/theme-ui.mjs
      - run: node desktop/service/test/links-ui.mjs
      - run: node desktop/service/test/voice-ui.mjs
      - run: node desktop/service/test/groups-ui.mjs
      - run: node desktop/service/test/conversation-ui.mjs
      - run: node desktop/service/test/mobile-ui.mjs
      - run: node desktop/service/test/workspace-edit-ui.mjs
      - run: node desktop/service/test/cards-ui.mjs
      - run: node desktop/service/test/clipboard-ui.mjs
      - run: node desktop/service/test/desktop-dictation-ui.mjs
