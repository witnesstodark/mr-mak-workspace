name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  # Dependency and project scripts run here with a read-only token and no
  # persisted credential. The tag is pushed by the separate job below.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Verify release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases can only be created from main. Current ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run release checks
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:template
          npm run build

  # No dependency or project code runs in this job: it only computes the
  # version, pushes the tag and starts the release build.
  release:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -z "${latest_tag}" ]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          case "${BUMP}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "Unsupported bump type: ${BUMP}" >&2; exit 1 ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          echo "next_tag=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "Next release: ${next_tag}"

      - name: Create and push tag
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "${NEXT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${NEXT_TAG} already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEXT_TAG}"
          git push origin "${NEXT_TAG}"
          gh workflow run release-build.yml --ref "${NEXT_TAG}" -f tag="${NEXT_TAG}"
